[build-system]
requires = ['setuptools', 'wheel']
build-backend = "setuptools.build_meta"

[project]
name='umlio'
dynamic = ["version"]
description = 'serialize deserialize umlshapes'
readme = "README.md"
authors = [{name = 'Humberto A. Sanchez II', email = 'Humberto.A.Sanchez.II@gmail.com'}]
maintainers = [{name = 'Humberto A. Sanchez II', email = 'Humberto.A.Sanchez.II@gmail.com'}]
keywords = ['uml', 'graphical', 'shapes', 'python', 'umldiagrammer']
license = 'AGPL-1.0-or-later'
license-files = ['LICENSE']

dependencies = [
    'untangle>=1.3.0',
    'wxPython>=4.3.1',
    'codeallybasic>=1.41.0',
    'codeallyadvanced>=3.1.0',
    'umlmodel>=4.0.0',
    'umlshapes>=4.1.1',
]

[project.optional-dependencies]
test = [
    'mypy==2.3.1',
    'mypy-extensions==1.1.0',
    'types-Deprecated==1.3.1.20260130',
    'html-testRunner~=1.2.1',
    'human_id==0.2.0',
    'types-networkx==3.6.1.20260728',
    'termcolor>=3.3.0',
]

deploy = [
    'wheel==0.48.0',
    'setuptools==84.0.0',
    'twine==7.0.0',
    'build==1.6.1',
]

[project.urls]
Repository = 'https://github.com/hasii2011/umlio'


[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
'umlio.resources' = ['loggingConfiguration.json']
umlio = ['py.typed']

[tool.setuptools.dynamic]
version = {attr = 'umlio.__version__'}

[project.scripts]

pyfabricate = "umlio.MainClass:commandHandler"
